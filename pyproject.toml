[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rift-pesummary-asimov-adapter"
version = "0.1.0a1"
description = "ASIMOV 0.7+ adapter for RIFT PESummary postprocessing"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "RIFT contributors"},
]
dependencies = [
  "asimov>=0.7,<0.8",
  "pesummary>=1.6",
]

[project.optional-dependencies]
test = [
  "pytest>=7",
  "jsonschema>=4",
]

[project.entry-points."asimov.pipelines"]
rift-pesummary = "rift_pesummary_asimov_adapter:RIFTPESummary"

[project.urls]
Repository = "https://github.com/oshaughnessy-junior/rift-pesummary-asimov-adapter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
